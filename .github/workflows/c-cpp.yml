name: Build Windows Static Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-windows-static-${{ runner.os }}-v1
          restore-keys: |
            vcpkg-windows-static-${{ runner.os }}-

      - name: Setup vcpkg
        run: |
          if (!(Test-Path "vcpkg/vcpkg.exe")) {
            git clone https://github.com/Microsoft/vcpkg.git
            cd vcpkg
            .\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Install dependencies
        run: |
          vcpkg/vcpkg install --triplet x64-windows-static curl openssl jsoncpp libzip bzip2 zlib zstd

      - name: Configure and build
        run: |
          mkdir build
          cd build
          cmake .. -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --target McUpdaterClient

      - name: Find and copy executable
        run: |
          $exePath = Get-ChildItem -Recurse -Path build -Filter McUpdaterClient.exe | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "Executable not found, listing build directory:"
            Get-ChildItem -Recurse -Path build
            exit 1
          }
          Write-Host "Found: $($exePath.FullName)"
          Copy-Item $exePath.FullName McUpdaterClient.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mc-updater-client-windows-static
          path: McUpdaterClient.exe

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-updater-client-windows-static
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/McUpdaterClient.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}